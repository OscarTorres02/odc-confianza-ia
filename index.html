<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Se puede confiar en la IA? · ODC Universidad de Cundinamarca</title>
<meta name="description" content="Objeto Digital de Conocimiento: indicadores para evaluar la confianza en modelos de aprendizaje supervisado explicables para decisiones organizacionales. Licencia CC BY-SA 4.0.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<div id="stage-wrap">
  <div id="stage" role="application" aria-label="Objeto Digital de Conocimiento">
    <header class="top">
      <span class="logo" aria-label="Universidad de Cundinamarca">UdeC</span>
      <span class="tt"><b>¿Se puede confiar en la IA?</b> · ODC</span>
      <span class="prog" id="prog" aria-live="polite">Pantalla 01 / 18</span>
      <span class="score-pill" id="scorePill" title="Puntaje acumulado">0 / 100</span>
      <button class="help" id="btnHelp" aria-label="Ayuda">?</button>
      <button class="menu" id="btnMenu" aria-label="Abrir menú">☰ Menú</button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <aside class="av" id="avatar" aria-label="Avatar guía Vera">
      <div class="avcard">
        <div class="avname">Vera · guía</div>
        <div class="avimg">
          <img id="veraRest" src="assets/img/vera_rest.svg" alt="Vera, avatar ilustrado que guía el recorrido">
          <img id="veraTalk" src="assets/img/vera_talk.svg" alt="" aria-hidden="true" class="hide">
          <img id="veraBlink" src="assets/img/vera_blink.svg" alt="" aria-hidden="true" class="hide">
        </div>
        <div class="transcript hide" id="transcript" tabindex="0" aria-label="Transcripción del audio"></div>
        <div class="avtag">Avatar Open Peeps (Pablo Stanley, CC0) · voz Piper «daniela» (CC BY-SA 4.0)</div>
      </div>
      <div class="ctrl">
        <button id="btnPlay" aria-label="Reproducir audio">▶</button>
        <button id="btnRestart" aria-label="Reiniciar audio">↺</button>
        <label class="vol"><span aria-hidden="true">🔊</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.9" aria-label="Volumen"></label>
        <button id="btnCC" aria-label="Mostrar transcripción" aria-pressed="false">CC</button>
      </div>
      <audio id="audio" preload="auto"></audio>
    </aside>

    <nav class="nav" aria-label="Navegación">
      <button class="b" id="btnPrev">← Anterior</button>
      <button class="b" id="btnMenu2">☰ Menú</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="b next" id="btnNext">Siguiente →</button>
    </nav>

    <div class="modal hide" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-box">
        <button class="modal-x" id="modalClose" aria-label="Cerrar">✕</button>
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/scorm.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
